# API Gateway: punto de entrada único para la interfaz web.
# Enruta cada prefijo /api/<recurso> al microservicio dueño de ese recurso.

server {
  listen 80;
  server_name _;

  # Interfaz web (empleado + administrador)
  location / {
    root /usr/share/nginx/html;
    index index.html;
  }

  # Endpoint interno entre microservicios: NO se expone al público.
  location = /api/empleados/verificacion {
    return 404;
  }

  location /api/empleados {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://empleados-service:3001;
  }

  location /api/marcaciones {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://asistencia-service:3002;
  }

  location /api/reportes {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://reportes-service:3003;
  }

  location /api/notificaciones {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://notificaciones-service:3004;
  }

  # Si un microservicio está caído, la interfaz recibe un JSON entendible
  # (flujo alterno "Error de conexión").
  error_page 502 503 504 = @servicio_no_disponible;
  location @servicio_no_disponible {
    default_type application/json;
    return 503 '{"error":"SERVICIO_NO_DISPONIBLE","mensaje":"La operación no pudo ser procesada: no fue posible comunicarse con el servidor."}';
  }
}
